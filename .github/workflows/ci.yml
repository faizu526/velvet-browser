name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pyqt5 libqt5gui5 xvfb

      - name: Install Python deps
        run: |
          pip install pytest pytest-cov
          pip install PyQt5 || true  # fallback if system package insufficient

      - name: Run data-layer tests (headless)
        run: |
          python -m pytest tests/test_data.py -v --tb=short

      - name: Syntax check all modules
        run: |
          python -m py_compile velvet/palette.py
          python -m py_compile velvet/data.py
          python -m py_compile velvet/heart.py
          python -m py_compile velvet/widgets.py
          python -m py_compile velvet/window.py
          python -m py_compile main.py
          echo "All modules compile OK"
