[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "velvet-browser"
version         = "2.0.0"
description     = "Persistent-profile Chromium launcher with premium UI"
readme          = "README.md"
requires-python = ">=3.9"
license         = {text = "MIT"}
dependencies    = ["PyQt5>=5.15.0"]

[project.scripts]
velvet = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["velvet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
